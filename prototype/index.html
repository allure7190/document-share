<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぽすなこつた 画面試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 外枠は灰青の作業机、店頭画面は紺の暖簾に紅しょうがの差し色。左に端末、右に画面遷移マップ */
  --ink:#1b2230; --muted:#5b6676; --chrome:#e6e9ef; --panel:#ffffff; --line:#d2d8e1;
  --beni:#d8345f; --nori:#3a7a3c; --navy:#1c2742; --sauce:#6b3f22; --katsuo:#f2d7a0;
  --font-d:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-b:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--chrome);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button,[role="button"],.map .node{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible{outline:3px solid var(--beni);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:currentColor;stroke:none}

/* ===== ページの枠 ===== */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font:700 20px/1.3 var(--font-d);text-wrap:balance}
.top h1 small{display:block;font:400 13px var(--font-b);color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.reset{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted)}
.layout{display:grid;gap:20px;padding:20px 24px 40px}
.layout.single{grid-template-columns:minmax(0,1.45fr) minmax(340px,1fr);align-items:start}
.layout.both .stage{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1100px){.layout.single{grid-template-columns:1fr}}
@media (max-width:820px){.layout.both .stage{grid-template-columns:1fr}.layout{padding:16px}}
.devblock{display:grid;gap:10px;min-width:0}
.devlabel{display:flex;align-items:baseline;gap:10px;font-weight:700}
.devlabel .cur{font-weight:500;color:var(--muted);font-size:14px}
.fitwrap{position:relative;width:100%;overflow:hidden}
.bezel{position:absolute;left:0;top:0;width:1064px;height:808px;padding:20px;background:#20242c;border-radius:44px;transform-origin:0 0;box-shadow:0 18px 40px rgba(20,30,50,.18)}
.screen{width:1024px;height:768px;border-radius:24px;overflow:hidden;position:relative;background:#fff}
.demo{background:#fff8e6;border:1px dashed #d9b66a;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.demo b{font-size:12px;color:#8a6414;letter-spacing:.04em;width:100%}
.dbtn{border:1px solid #d3b06a;background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.dbtn[aria-pressed="true"]{background:#8a6414;border-color:#8a6414;color:#fff}

/* ===== 遷移マップ ===== */
.mappanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px;min-width:0}
.layout.both .mappanel{grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);align-items:start}
.layout.both .mappanel>.maphead{grid-column:1/-1}
@media (max-width:820px){.layout.both .mappanel{grid-template-columns:1fr}}
.maphead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.maphead h2{margin:0;font:700 17px var(--font-d)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mapwrap{overflow-x:auto}
.map{width:100%;min-width:480px;height:auto;display:block}
.map .node rect{fill:#f4f6f9;stroke:#c3cad5;stroke-width:1.5}
.map .node.vis rect{fill:#eef6ee;stroke:#9cc59d}
.map .node.cur rect{fill:var(--beni);stroke:var(--beni)}
.map .node text{font-family:var(--font-b);fill:var(--ink)}
.map .node .nid{font-size:11px;fill:var(--muted)}
.map .node .nt{font-size:13px;font-weight:700}
.map .node.cur text{fill:#fff}
.map .node{cursor:pointer}
.map .node:hover rect{stroke:var(--ink)}
.map .edge{stroke:#b9c1cd;stroke-width:1.6;fill:none}
.map .edge.out{stroke:var(--ink);stroke-width:2}
.map .edge.hot{stroke:var(--beni);stroke-width:3}
.map .elabel rect{fill:#fff;stroke:var(--beni);stroke-width:1}
.map .elabel text{font-size:12px;fill:var(--beni);font-weight:700;font-family:var(--font-b)}
.sub h3{margin:0 0 6px;font-size:14px}
.sub ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.sub li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.btnname{background:var(--ink);color:#fff;border-radius:6px;padding:0 8px;font-size:12.5px}
.btnname.back{background:#8d97a6}
.chip{font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
.foot{padding:0 24px 32px;color:var(--muted);font-size:13px}

/* ===== スマホ表示 ===== */
.mbar{display:none}
.fitwrap.zoom{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){
  .top{padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));gap:10px}
  .top h1{font-size:18px}
  .top h1 small{font-size:12px}
  .tabs{margin-left:0;width:100%}
  .tab{white-space:nowrap;padding:7px 12px;font-size:13.5px}
  .reset{padding:7px 12px}
  .layout{padding:12px 10px 32px;gap:14px}
  .bezel{border-radius:36px}
  .mappanel{padding:14px}
  .demo{padding:10px}
  .dbtn{padding:8px 12px;font-size:14px}
  .foot{padding:0 16px 32px}
  .mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;font-size:13px;color:var(--muted)}
  .mbar .dbtn:not([aria-pressed="true"]){background:var(--panel)}
}
@media (max-width:700px) and (orientation:landscape){.mbar .rot{display:none}}
.toast{bottom:max(24px,env(safe-area-inset-bottom))}

/* ===== お客様タブレット ===== */
.cust{position:relative;overflow:hidden;height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 0 0,#2a3860 0,transparent 55%),var(--navy);color:#fbf4e6;font-family:var(--font-d)}
.c-head{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid rgba(255,255,255,.12)}
.c-head .shop{font-size:22px;font-weight:700;letter-spacing:.06em}
.c-head .svc{font-size:16px;color:var(--katsuo);display:flex;gap:8px;align-items:center}
.c-body{flex:1;padding:28px 44px 30px;display:flex;flex-direction:column;gap:20px;min-height:0}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:15px;color:rgba(251,244,230,.7)}
.c-title{margin:0;font-size:42px;line-height:1.3;font-weight:900;text-wrap:balance}
.c-lead{margin:0;font-size:22px;color:rgba(251,244,230,.85)}
.cbtn{border:0;border-radius:22px;padding:22px 34px;font:700 28px var(--font-d);display:inline-flex;align-items:center;justify-content:center;gap:14px}
.cbtn.primary{background:var(--beni);color:#fff;box-shadow:0 8px 0 #8f1f3d}
.cbtn.primary:active{transform:translateY(4px);box-shadow:0 4px 0 #8f1f3d}
.cbtn.ghost{background:transparent;border:2px solid rgba(251,244,230,.45);color:#fbf4e6}
.cbtn.light{background:#fbf4e6;color:var(--navy)}
.cbtn.small{font-size:20px;padding:12px 22px;border-radius:14px}
.cbtn.huge{font-size:40px;padding:30px 40px}
.pill{display:inline-block;align-self:flex-start;background:var(--katsuo);color:var(--navy);border-radius:999px;padding:4px 18px;font-size:20px;font-weight:700}
.c01{flex:1;display:grid;grid-template-columns:380px 1fr;gap:36px;min-height:0}
.sign{background:linear-gradient(160deg,#7a4626,#4c2814);border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.sign-tag{align-self:flex-start;background:var(--beni);color:#fff;border-radius:8px;padding:2px 12px;font-size:17px}
.sign-main{font-size:40px;font-weight:900;line-height:1.2;margin-top:8px}
.sign-price{font-size:56px;font-weight:900;color:var(--katsuo);font-variant-numeric:tabular-nums}
.sign-sub{margin-top:auto;font-size:14px;color:rgba(251,244,230,.6)}
.sign .ball{position:absolute;right:-30px;bottom:30px;width:190px;opacity:.95}
.c01-act{display:flex;flex-direction:column;justify-content:center;gap:22px}
.c01-act .cbtn{width:100%}
.mini{display:flex;gap:8px;flex-wrap:nowrap}
.mini svg{width:40px;height:40px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.tile{border:2px solid rgba(251,244,230,.25);background:rgba(255,255,255,.06);border-radius:26px;padding:24px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;color:#fbf4e6;font-family:var(--font-d)}
.tile .ic{font-size:44px;color:var(--katsuo)}
.tile strong{font-size:32px}
.tile span{font-size:18px;color:rgba(251,244,230,.75)}
.tile.rec{border-color:var(--beni);background:rgba(216,52,95,.16)}
.tile .badge{background:var(--beni);color:#fff;border-radius:6px;padding:0 10px;font-size:15px}
.split{flex:1;display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:center;min-height:0}
.split .txt{display:flex;flex-direction:column;gap:18px}
.cam{position:relative;width:420px;height:420px;border-radius:32px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#34446a,#0d1322)}
.cam .person{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s}
.cam .person.l{transform:translateX(-26px) scaleX(.94)}
.cam .person.r{transform:translateX(26px) scaleX(.94)}
.cam .guide{position:absolute;left:50%;top:43%;width:210px;height:270px;transform:translate(-50%,-50%);border:4px dashed rgba(255,255,255,.7);border-radius:50%}
.cam.scan .guide,.cam.live .guide{border-style:solid;border-color:var(--katsuo)}
.cam.ok .guide{border-color:#7fd17f;border-style:solid}
.cam.ng .guide{border-color:#ff6b8a;border-style:solid}
.scanline{position:absolute;left:18%;right:18%;height:3px;background:var(--katsuo);box-shadow:0 0 18px var(--katsuo);top:18%;animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{to{top:70%}}
.rec{position:absolute;left:16px;top:14px;font:500 15px var(--font-b);color:#fff;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:999px}
.rec span{width:10px;height:10px;border-radius:50%;background:#ff4d6d;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.msg-ng{font-size:26px;color:#ffb3c4;margin:0}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:22px}
.steps li{display:flex;gap:12px;align-items:center;color:rgba(251,244,230,.5)}
.steps li.now{color:#fff;font-weight:700}
.steps li.done{color:#9ad59b}
.steps .n{width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:17px;flex:none}
.hello{font-size:40px;font-weight:900;line-height:1.3}
.hello span{color:var(--katsuo)}
.card{background:#fbf4e6;border-radius:26px;padding:22px 28px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;justify-items:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card svg{width:104px;height:104px}
.card .slot{position:relative}
.card .slot em{position:absolute;right:2px;bottom:0;font:700 14px var(--font-b);color:#9a8a70;font-style:normal}
.stamp.pop{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.c04-msg{font-size:28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.c04-msg b{color:var(--katsuo);font-size:40px}
.reward{background:var(--beni);color:#fff;border-radius:20px;padding:14px 24px;font-size:28px;font-weight:900}
.note{font-size:18px;color:#ffd38a;margin:0}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.digits{display:flex;gap:14px}
.digits span{width:76px;height:92px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid rgba(251,244,230,.35);display:grid;place-items:center;font-size:48px;font-weight:900}
.digits span.on{border-color:var(--katsuo)}
.keys{display:grid;grid-template-columns:repeat(3,96px);gap:12px}
.key{height:76px;border-radius:16px;border:0;background:rgba(255,255,255,.12);color:#fbf4e6;font:700 32px var(--font-d)}
.key.sub{font-size:20px}
.cands{display:grid;gap:14px}
.cand{display:flex;align-items:center;justify-content:space-between;gap:16px;border:2px solid rgba(251,244,230,.35);background:rgba(255,255,255,.06);border-radius:20px;padding:18px 24px;font:700 30px var(--font-d);color:#fbf4e6;text-align:left}
.cand small{font-size:17px;font-weight:500;color:rgba(251,244,230,.7)}
.form{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label,.field .lab{font-size:20px;color:rgba(251,244,230,.85)}
.field input{height:66px;border-radius:14px;border:2px solid rgba(251,244,230,.35);background:rgba(255,255,255,.08);color:#fff;font:700 28px var(--font-d);padding:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.cchip{border:2px solid rgba(251,244,230,.35);background:transparent;color:#fbf4e6;border-radius:999px;padding:8px 20px;font:700 20px var(--font-d)}
.cchip[aria-pressed="true"]{background:var(--katsuo);border-color:var(--katsuo);color:var(--navy)}
.err{color:#ffb3c4;font-size:19px;margin:0}
.consent{background:#fbf4e6;color:var(--navy);border-radius:24px;padding:24px 32px;display:grid;gap:10px}
.consent ul{margin:0;padding-left:1.2em;font-size:22px;line-height:1.55}
.consent b{color:var(--beni)}
.linkbtn{border:0;background:none;color:var(--katsuo);text-decoration:underline;font:500 18px var(--font-d);padding:0;justify-self:start}
.consent .linkbtn{color:var(--navy)}
.policy{font:400 14px/1.6 var(--font-b);background:#fff;border-radius:12px;padding:12px 16px;max-height:120px;overflow:auto;color:var(--ink)}
.eq{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.member{display:grid;grid-template-columns:260px 1fr;gap:40px;align-items:center;flex:1}
.qr{width:260px;height:260px;border-radius:16px;shape-rendering:crispEdges;background:#fff}
.mno{font-size:20px;color:rgba(251,244,230,.75)}
.mno b{display:block;font-size:44px;color:#fff;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.okbadge{display:inline-flex;gap:8px;align-items:center;background:rgba(127,209,127,.18);color:#a9e3a9;border-radius:999px;padding:4px 16px;font-size:18px}
.qrframe{width:380px;height:380px;border-radius:32px;background:#0d1322;position:relative;display:grid;place-items:center}
.qrframe::before{content:"";position:absolute;inset:40px;border:5px solid var(--katsuo);border-radius:18px;clip-path:polygon(0 0,30% 0,30% 6%,6% 6%,6% 30%,0 30%,0 70%,6% 70%,6% 94%,30% 94%,30% 100%,70% 100%,70% 94%,94% 94%,94% 70%,100% 70%,100% 30%,94% 30%,94% 6%,70% 6%,70% 0,100% 0,100% 100%,0 100%)}
.qrframe .ic{font-size:120px;color:rgba(251,244,230,.3)}
.bigball{width:240px}
.spin{width:40px;height:40px;border:5px solid rgba(251,244,230,.25);border-top-color:var(--katsuo);border-radius:50%;animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.cd{font-variant-numeric:tabular-nums}

/* ===== スタッフ端末 ===== */
.stf{height:100%;display:flex;flex-direction:column;background:#f4f6f9;color:var(--ink);font-family:var(--font-b)}
.s-head{height:64px;flex:none;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 28px}
.s-head strong{font-size:19px}
.s-head span{font-size:15px;color:#c3cad5}
.s-head .out{margin-left:auto;border:1px solid #56607a;background:transparent;color:#fff;border-radius:8px;padding:4px 14px;font-size:15px}
.s-body{flex:1;padding:24px 28px;display:flex;flex-direction:column;gap:18px;min-height:0}
.s-title{margin:0;font-size:26px;font-weight:700}
.sbtn{border:0;border-radius:14px;padding:16px 22px;font:700 21px var(--font-b);display:inline-flex;gap:10px;align-items:center;justify-content:center}
.sbtn.primary{background:var(--beni);color:#fff}
.sbtn.dark{background:var(--ink);color:#fff}
.sbtn.line{background:#fff;border:2px solid var(--line)}
.sbtn.green{background:var(--nori);color:#fff}
.pinbox{margin:auto;display:grid;gap:22px;justify-items:center}
.dots{display:flex;gap:18px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.skeys{display:grid;grid-template-columns:repeat(3,110px);gap:12px}
.skey{height:84px;border-radius:14px;border:1px solid var(--line);background:#fff;font:700 32px var(--font-b);font-variant-numeric:tabular-nums}
.skey.sub{font-size:20px;color:var(--muted)}
.s02{flex:1;display:grid;grid-template-columns:1fr 360px;gap:28px;min-height:0}
.s02 .left{display:flex;flex-direction:column;gap:16px}
.amount{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 24px;display:flex;justify-content:space-between;align-items:baseline}
.amount span{font-size:18px;color:var(--muted)}
.amount b{font-size:58px;font-variant-numeric:tabular-nums}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:16px;line-height:1.3}
.mbtn small{display:block;color:var(--muted);font-size:14px}
.acts{display:grid;gap:10px;margin-top:auto}
.acts .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s02 .skeys{grid-template-columns:repeat(3,1fr)}
.scard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 28px;display:grid;gap:14px}
.status{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700}
.st-pill{border-radius:999px;padding:2px 14px;font-size:15px;font-weight:700}
.st-wait{background:#fff1c9;color:#7a5600}
.st-ok{background:#dcf0dc;color:#245a26}
.st-alert{background:#ffe0e8;color:#9c1c3f}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;font-size:19px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
.sspin{width:30px;height:30px;border:4px solid #e2e6ec;border-top-color:var(--beni);border-radius:50%;animation:rot 1s linear infinite}
.s-alert{background:#ffe0e8;border:2px solid var(--beni);border-radius:16px;padding:14px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;font-size:19px;font-weight:700;color:#9c1c3f}
.s05{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px;min-height:0}
.s05 input{width:100%;height:56px;border-radius:12px;border:1px solid var(--line);padding:0 16px;font:500 20px var(--font-b);background:#fff}
.slist{display:grid;gap:8px;overflow:auto;align-content:start}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:18px;text-align:left}

.rchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-size:16px}
.rchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--muted);font-size:18px}

/* ===== 管理画面 ===== */
.adm{height:100%;display:grid;grid-template-columns:200px 1fr;background:#f6f7fa;font-family:var(--font-b);color:var(--ink)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side .logo{font:900 20px var(--font-d);padding:0 10px 14px;color:var(--navy)}
.side .logo small{display:block;font:500 12px var(--font-b);color:var(--muted)}
.nav{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-size:16px}
.nav[aria-current="page"]{background:#ffe8ee;color:#a11c42;font-weight:700}
.amain{padding:22px 26px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-width:0}
.amain h2{margin:0;font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi small{font-size:12px;color:var(--muted)}
.panel2{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.box h3{margin:0;font-size:15px;display:flex;justify-content:space-between}
.box h3 small{font-weight:400;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end;height:170px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 41px,#eef0f4 41px 42px)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;font-variant-numeric:tabular-nums}
.bar i{width:70%;background:#e9a2b6;border-radius:4px 4px 0 0}
.bar.now i{background:var(--beni)}
.barx{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;font-size:12px;color:var(--muted);text-align:center}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #eceff3;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:500}
tr.click{cursor:pointer}
tr.click:hover td{background:#fff5f8}
.tag{display:inline-block;border-radius:4px;padding:0 8px;font-size:12.5px}
.tag.y{background:#dcf0dc;color:#245a26}
.tag.n{background:#eceff3;color:var(--muted)}
.abtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font-size:15px}
.abtn.red{border-color:#e3a3b4;color:#a11c42}
.abtn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.confirm{border:2px solid var(--beni);background:#fff5f8;border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sets label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.sets input{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:500 17px var(--font-b);color:var(--ink)}
/* 待機画面のおすすめ切替（X-14） */
.sign-in{display:flex;flex-direction:column;gap:8px;flex:1;animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sign-dots{display:flex;gap:8px;position:absolute;left:30px;bottom:56px}

.sign-dots i.on{background:var(--katsuo)}
/* 10個目の特別演出（X-10） */
.card.full{animation:glow 1.4s ease-in-out .6s 3 alternate}
@keyframes glow{to{box-shadow:0 10px 0 rgba(0,0,0,.25),0 0 0 8px var(--katsuo),0 0 40px 10px rgba(242,215,160,.7)}}
.complete{position:absolute;right:30px;top:146px;z-index:2;background:var(--katsuo);color:var(--navy);font-weight:900;font-size:30px;padding:8px 26px;border-radius:999px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) .5s both;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.rain svg{position:absolute;top:-80px;width:56px;height:56px;animation:fall 2.6s ease-in both}
@keyframes fall{to{transform:translateY(900px) rotate(320deg)}}
/* 簡易モード（I-11） */
.sbtn.quick{background:#fff;border:2px dashed var(--ink);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>

  <h1>ぽすなこつた 画面試作 v0.2<small>端末のボタンを押すと、マップで画面のつながりが分かります。お客様やお店のデータはすべて例です。</small></h1>
  <div class="tabs" role="group" aria-label="表示する端末">
    <button class="tab" data-a="mode" data-mode="cust">お客様タブレット</button>
    <button class="tab" data-a="mode" data-mode="staff">スタッフ端末</button>

</header>
<main id="app"></main>
<p class="foot">試作品のため、顔認証・カメラ・サーバーへの保存は動きを再現しているだけです。黄色の「デモ操作」は試作品専用のボタンで、本番の画面にはありません。ページを開き直すと最初の状態に戻ります。</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- 小道具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen = n => Number(n).toLocaleString('ja-JP') + '円';
const pad = n => String(n).padStart(2, '0');
const nowT = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const amt = v => v == null ? `${yen(S.settings.minAmount)}以上（簡易）` : yen(v);
const nid = k => k[0] + '-' + k.slice(1);
const DEVNAME = {cust:'お客様タブレット', staff:'スタッフ端末', admin:'管理画面'};
const METHOD = {face:'顔', phone:'電話番号', qr:'会員QR', staff:'スタッフ検索', new:'新規登録', none:'非会員'};

const IC = {
  face:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="9" cy="10" r="1.1" class="f"/><circle cx="15" cy="10" r="1.1" class="f"/><path d="M9 15c1.6 1.4 4.4 1.4 6 0"/></svg>',
  phone:'<svg viewBox="0 0 24 24" class="ic"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>',
  qr:'<svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="3.5" width="6" height="6"/><rect x="14.5" y="3.5" width="6" height="6"/><rect x="3.5" y="14.5" width="6" height="6"/><path d="M14.5 14.5h2v2h-2zM18.5 18.5h2v2h-2zM14.5 20.5v-2M20.5 14.5h-2"/></svg>',
  add:'<svg viewBox="0 0 24 24" class="ic"><circle cx="10" cy="8" r="4"/><path d="M3 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5M19 6v6M16 9h6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" class="ic"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* たこ焼きのスタンプ */
function tako(filled, pop){
  if(!filled) return '<svg viewBox="0 0 60 60" class="stamp"><circle cx="30" cy="30" r="25" fill="none" stroke="#c9b48e" stroke-width="2.5" stroke-dasharray="5 5"/></svg>';
  return `<svg viewBox="0 0 60 60" class="stamp${pop?' pop':''}"><circle cx="30" cy="31" r="26" fill="#c98a45"/><path d="M7 27Q14 13 30 12Q47 12 53 27Q46 34 38 30Q30 36 22 30Q14 34 7 27Z" fill="#5a2f17"/><path d="M13 22l6 5 6-6 6 6 6-6 6 5" fill="none" stroke="#fff6dc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="40" r="2" fill="#3a7a3c"/><circle cx="35" cy="45" r="1.8" fill="#3a7a3c"/><circle cx="43" cy="37" r="1.6" fill="#3a7a3c"/><circle cx="27" cy="47" r="1.5" fill="#3a7a3c"/></svg>`;
}
function stampCard(n, req, popIdx){
  let h = '';
  for(let i=0;i<req;i++) h += `<div class="slot">${tako(i<n, i===popIdx)}${i<n?'':`<em>${i+1}</em>`}</div>`;
  return `<div class="card">${h}</div>`;
}
function qrSVG(seed){
  let s = seed % 233280;
  const r = () => { s = (s*9301 + 49297) % 233280; return s/233280; };
  let out = '';
  for(let y=0;y<21;y++) for(let x=0;x<21;x++){
    if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue;
    if(r() > .5) out += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const f = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="-2 -2 25 25" class="qr" fill="#111"><rect x="-2" y="-2" width="25" height="25" fill="#fff"/>${out}${f(0,0)}${f(14,0)}${f(0,14)}</svg>`;
}
function camView(cls, turn){
  return `<div class="cam ${cls}"><svg viewBox="0 0 400 400" class="person ${turn||''}"><ellipse cx="200" cy="168" rx="70" ry="86" fill="#7c8ba5"/><path d="M58 400c10-88 70-128 142-128s132 40 142 128z" fill="#64728b"/></svg><div class="guide"></div>${cls==='scan'||cls==='live'?'<div class="scanline"></div>':''}<div class="rec"><span></span>カメラ作動中</div></div>`;
}

/* ---------- 状態 ---------- */
function initState(){
  return {
    mode:'cust', mapDev:'cust',
    settings:{minAmount:500, dailyLimit:2, required:10, rewardName:'8個入り1舟 無料', expireMonths:12, threshold:99},
    members:[
      {id:'m1',no:1001,nick:'たこ好き太郎',last4:'5678',age:'30代',stamps:3,face:true,visits:13,today:0,last:'11/08'},
      {id:'m2',no:1002,nick:'明太マヨ子',last4:'1122',age:'20代',stamps:9,face:true,visits:29,today:0,last:'11/09'},
      {id:'m3',no:1003,nick:'ねぎポン',last4:'5678',age:'40代',stamps:6,face:false,visits:16,today:0,last:'11/05'},
      {id:'m4',no:1004,nick:'青のり多め',last4:'3300',age:'50代',stamps:1,face:true,visits:2,today:0,last:'10/28'}
    ],
    nextNo:1043, checkout:null, redeemCount:0, newCount:0,
    cust:{screen:'C01', fail:0, matched:null, lastGrant:null, digits:'', draft:{nickname:'',phone:'',age:''}, err:'', showPolicy:false, scanning:false, faceMsg:'', liveStep:0, liveFail:false, newId:null, countdown:10},
    staff:{screen:'S01', pin:'', amount:'', search:'', sel:null, reason:'', cancelReason:''},
    admin:{screen:'A02', sel:'m1', confirm:null},
    demo:{face:'m1', autoBack:true},
    visits:[], audit:[], history:[],
    lastEdge:{cust:null, staff:null, admin:null},
    visited:{cust:new Set(['C01']), staff:new Set(['S01']), admin:new Set(['A02'])}
  };
}
let S = initState();
const T = {cust:null, staff:null, admin:null};
const clearT = d => { clearTimeout(T[d]); clearInterval(T[d]); T[d] = null; };
const mem = id => S.members.find(m => m.id === id);
const audit = (actor, action, detail) => S.audit.unshift({time:nowT(), actor, action, detail});
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- 画面遷移マップの定義 ---------- */
const MAPS = {
  cust:{
    nodes:{C01:{t:'待機',x:0,y:2},C03:{t:'顔照合',x:1,y:0},C02:{t:'照合方法の選択',x:1,y:2},C05:{t:'電話番号照合',x:2,y:1},C10:{t:'会員QR照合',x:2,y:2},
      C04:{t:'照合結果',x:3,y:0},C11:{t:'特典受付',x:4,y:0},C06:{t:'新規登録',x:1,y:4},C07:{t:'顔登録の同意',x:2,y:4},C08:{t:'顔登録',x:3,y:4},C09:{t:'登録完了',x:3,y:3}},
    edges:[
      {f:'C01',t:'C03',l:'顔でスタンプ'},{f:'C01',t:'C02',l:'ほかの方法・はじめての方'},
      {f:'C02',t:'C03',l:'顔'},{f:'C02',t:'C05',l:'電話番号'},{f:'C02',t:'C10',l:'会員QR'},{f:'C02',t:'C06',l:'はじめての方'},
      {f:'C03',t:'C04',l:'顔が一致（自動）'},{f:'C03',t:'C05',l:'2回照合できなかった（自動）'},{f:'C03',t:'C05',l:'電話番号で探す'},{f:'C03',t:'C03',l:'もう一度撮影',back:true},
      {f:'C05',t:'C04',l:'ニックネームを選択'},{f:'C10',t:'C04',l:'QRを読み取り（自動）'},
      {f:'C06',t:'C07',l:'次へ'},{f:'C07',t:'C08',l:'同意して顔を登録する'},{f:'C07',t:'C09',l:'顔は使わない'},
      {f:'C08',t:'C09',l:'登録完了（自動）'},{f:'C08',t:'C09',l:'顔は使わない'},{f:'C09',t:'C04',l:'スタンプを押す'},{f:'C04',t:'C11',l:'特典を使う'},
      {f:'C04',t:'C01',l:'閉じる／次回にする／10秒経過',back:true},{f:'C11',t:'C01',l:'スタッフが特典を確定（自動）',back:true},{f:'C11',t:'C04',l:'スタッフが申請を取り消し（自動）',back:true},
      {f:'C02',t:'C01',l:'やめる',back:true},{f:'C03',t:'C01',l:'やめる',back:true},{f:'C05',t:'C01',l:'やめる',back:true},{f:'C10',t:'C01',l:'やめる',back:true},
      {f:'C06',t:'C01',l:'やめる',back:true},{f:'C07',t:'C06',l:'戻る',back:true}
    ]},
  staff:{

    edges:[
      {f:'S01',t:'S02',l:'PINを入力'},{f:'S02',t:'S03',l:'顔照合を開始'},{f:'S02',t:'S03',l:'簡易モードで照合を開始'},{f:'S02',t:'S05',l:'会員を探して手動付与'},{f:'S02',t:'S02',l:'非会員として記録',back:true},
      {f:'S03',t:'S04',l:'特典を確認する'},{f:'S03',t:'S06',l:'このスタンプを取り消す'},{f:'S03',t:'S02',l:'次の会計へ',back:true},
      {f:'S04',t:'S02',l:'商品を渡した（確定）',back:true},{f:'S04',t:'S03',l:'申請を取り消す',back:true},
      {f:'S05',t:'S02',l:'スタンプを付与／戻る',back:true},{f:'S06',t:'S02',l:'取り消す（確定）',back:true},{f:'S06',t:'S03',l:'戻る',back:true},
      {f:'S02',t:'S01',l:'ログアウト',back:true}
    ]},
  admin:{
    nodes:{A02:{t:'ダッシュボード',x:0,y:1},A03:{t:'会員一覧',x:1,y:1},A04:{t:'会員詳細・削除',x:2,y:1},A05:{t:'スタンプ設定',x:1,y:0},A08:{t:'操作ログ',x:1,y:2}},
    edges:[
      {f:'A02',t:'A03',l:'会員'},{f:'A02',t:'A05',l:'設定'},{f:'A02',t:'A08',l:'操作ログ'},{f:'A03',t:'A04',l:'会員の行をタップ'},
      {f:'A04',t:'A03',l:'一覧へ戻る／退会させる',back:true},{f:'A05',t:'A05',l:'保存する',back:true}
    ]}
};

/* ---------- 遷移 ---------- */
function prepare(dev, to){
  const c = S.cust, s = S.staff;
  if(to==='C03'){ c.scanning = true; c.faceMsg = ''; }
  if(to==='C05') c.digits = '';
  if(to==='C08'){ c.liveStep = 0; c.liveFail = false; }
  if(to==='C04') c.countdown = 10;
  if(to==='S01') s.pin = '';
  if(to==='S02') s.amount = '';
  if(to==='S05'){ s.search = ''; s.sel = null; s.reason = ''; }
  if(to==='S06') s.cancelReason = '';
  if(to==='A04') S.admin.confirm = null;
}
function afterEnter(dev, to){
  if(to==='C03') T.cust = setTimeout(faceResult, 1800);
  if(to==='C08') T.cust = setTimeout(liveTick, 1300);
  if(to==='C04') startC04Timer();
}
function go(dev, to, label){
  const from = S[dev].screen;
  clearT(dev);
  prepare(dev, to);
  S[dev].screen = to;
  S.visited[dev].add(to);
  S.lastEdge[dev] = {f:from, t:to, l:label};
  S.history.unshift({dev, f:from, t:to, l:label, time:nowT()});
  S.history.length = Math.min(S.history.length, 10);
  if(S.mode==='both' || S.mode===dev) S.mapDev = dev;
  render();
  afterEnter(dev, to);
}
function jump(dev, to){
  const c = S.cust, req = S.settings.required;
  if(['C02','C03','C05','C10'].includes(to) && !(S.checkout && S.checkout.status==='waiting')) startCheckout(800);
  if(to==='C04' && !mem(c.matched)){ c.matched = 'm1'; c.lastGrant = {granted:0, note:'マップから直接開いたため、スタンプは押していません'}; }
  if(to==='C11' || to==='S04'){
    const m = mem('m2') || S.members[0];
    m.stamps = Math.max(m.stamps, req); c.matched = m.id; c.lastGrant = {granted:0, note:''};
    S.checkout = {amount:800, status:'reward', memberId:m.id, granted:0, method:'face'};
  }
  if(['C07','C08'].includes(to) && !c.draft.nickname) c.draft = {nickname:'はじめてのたこ', phone:'080-5555-6666', age:'20代'};
  if(to==='C09' && !mem(c.newId)){ if(!c.draft.nickname) c.draft = {nickname:'はじめてのたこ', phone:'080-5555-6666', age:'20代'}; createMember(true); }
  if(to==='A04' && !mem(S.admin.sel)) S.admin.sel = S.members[0] && S.members[0].id;
  go(dev, to, 'マップから直接移動');
}

/* ---------- 業務ロジック（本番ではサーバー側） ---------- */
function startCheckout(amount){ S.checkout = {amount, status:'waiting', memberId:null, granted:0, method:null}; S.cust.fail = 0; }
function identify(id, method){
  const m = mem(id); if(!m) return;
  const co = S.checkout, st = S.settings;
  let granted = 0, note = '';
  if(co && co.status==='waiting'){
    if(co.amount != null && co.amount < st.minAmount) note = `${yen(st.minAmount)}未満のお会計はスタンプの対象外です`;
    else if(m.today >= st.dailyLimit) note = `スタンプは1日${st.dailyLimit}個までです`;
    else { m.stamps++; m.today++; granted = 1; }
    Object.assign(co, {status:'done', memberId:id, granted, method});
    m.visits++; m.last = '今日';
    S.visits.unshift({time:nowT(), nick:m.nick, amount:co.amount, method, granted});
    audit(method==='staff' ? 'スタッフ' : 'システム', granted ? 'スタンプ付与' : '来店記録', `${m.nick}（${METHOD[method]}で照合）`);
  } else if(!co || co.status!=='waiting'){
    note = '会計が入力されていないため、スタンプは押していません';
  }
  S.cust.matched = id; S.cust.lastGrant = {granted, note}; S.cust.fail = 0;
}
function faceResult(){
  const r = S.demo.face, m = mem(r);
  if(r==='none' || !m || !m.face){
    S.cust.fail++;
    if(S.cust.fail >= 2){ S.cust.fail = 0; go('cust','C05','2回照合できなかった（自動）'); return; }
    S.cust.scanning = false; S.cust.faceMsg = 'お顔を確認できませんでした'; render(); return;

  identify(r, 'face');
  go('cust','C04','顔が一致（自動）');
}
function liveTick(){
  const c = S.cust; if(c.liveFail) return;
  c.liveStep++; render();
  if(c.liveStep >= 3){ T.cust = setTimeout(() => { createMember(true); go('cust','C09','登録完了（自動）'); }, 1100); }
  else T.cust = setTimeout(liveTick, 1300);
}
function startC04Timer(){
  const m = mem(S.cust.matched);

/* ---------- 遷移マップ ---------- */
function mapSVG(dev){
  const M = MAPS[dev], N = M.nodes, keys = Object.keys(N);
  const CW = 132, RH = 76, NW = 114, NH = 50, P = 12;
  const W = P*2 + Math.max(...keys.map(k => N[k].x))*CW + NW, H = P*2 + Math.max(...keys.map(k => N[k].y))*RH + NH;
  const C = k => ({x:P + N[k].x*CW + NW/2, y:P + N[k].y*RH + NH/2});
  const cur = S[dev].screen, le = S.lastEdge[dev];
  const seen = new Set(); let lines = '', label = '';
  M.edges.forEach(e => {
    if(e.back || e.f===e.t || seen.has(e.f+e.t)) return; seen.add(e.f+e.t);
    const a = C(e.f), b = C(e.t), dx = b.x-a.x, dy = b.y-a.y;
    const clip = (c, sx, sy) => { const t = Math.min((NW/2+3)/Math.abs(sx||1e-6), (NH/2+3)/Math.abs(sy||1e-6)); return {x:c.x+sx*t, y:c.y+sy*t}; };
    const p1 = clip(a, dx, dy), p2 = clip(b, -dx, -dy);
    const hot = le && le.f===e.f && le.t===e.t, out = e.f===cur;
    lines += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" class="edge${hot?' hot':''}${out&&!hot?' out':''}" marker-end="url(#ar-${dev}${hot?'h':out?'o':''})"/>`;
    if(hot){ const mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2, w = [...le.l].length*12 + 14; label = `<g class="elabel"><rect x="${mx-w/2}" y="${my-11}" width="${w}" height="22" rx="6"/><text x="${mx}" y="${my+4.5}" text-anchor="middle">${esc(le.l)}</text></g>`; }
  });
  const nodes = keys.map(k => { const c = C(k); return `<g class="node${k===cur?' cur':S.visited[dev].has(k)?' vis':''}" data-a="jump" data-dev="${dev}" data-to="${k}" role="button" tabindex="0" aria-label="${nid(k)} ${N[k].t}へ移動"><rect x="${c.x-NW/2}" y="${c.y-NH/2}" width="${NW}" height="${NH}" rx="10"/><text class="nid" x="${c.x}" y="${c.y-6}" text-anchor="middle">${nid(k)}</text><text class="nt" x="${c.x}" y="${c.y+13}" text-anchor="middle">${N[k].t}</text></g>`; }).join('');
  const mk = (id, col) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${col}"/></marker>`;
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${DEVNAME[dev]}の画面遷移マップ"><defs>${mk('ar-'+dev,'#b9c1cd')}${mk('ar-'+dev+'o','#1b2230')}${mk('ar-'+dev+'h','#d8345f')}</defs>${lines}${nodes}${label}</svg>`;
}
function mapPanel(){
  const dev = S.mode==='both' ? S.mapDev : S.mode, cur = S[dev].screen, N = MAPS[dev].nodes;
  const outs = MAPS[dev].edges.filter(e => e.f===cur);
  const devTabs = S.mode==='both' ? `<div class="tabs" style="margin-left:0">${['cust','staff'].map(d => `<button class="tab" data-a="mapDev" data-dev="${d}" aria-pressed="${dev===d}">${DEVNAME[d]}</button>`).join('')}</div>` : '';
  const hist = S.history.length ? S.history.map(h => `<li><span class="chip">${DEVNAME[h.dev].slice(0,4)}</span>${nid(h.f)} → <b>${nid(h.t)} ${MAPS[h.dev].nodes[h.t].t}</b><span class="hint">「${esc(h.l)}」${h.time}</span></li>`).join('') : '<li class="hint">まだ操作していません</li>';
  return `<div class="maphead"><h2>画面遷移マップ：${DEVNAME[dev]}</h2>${devTabs}
      <div class="legend"><span><i style="background:var(--beni)"></i>今の画面</span><span><i style="background:#eef6ee;border:1px solid #9cc59d"></i>表示した画面</span><span><i style="background:var(--ink);height:3px;vertical-align:3px"></i>今の画面から行ける</span><span><i style="background:var(--beni);height:3px;vertical-align:3px"></i>直前の遷移</span></div>
      <p class="hint" style="width:100%">マップの四角を押すと、その画面へ直接移動できます。最初の画面に戻る線は省略し、下の一覧に載せています。</p></div>
    <div class="mapwrap">${mapSVG(dev)}</div>
    <div style="display:grid;gap:16px">
      <div class="sub"><h3>${nid(cur)} ${N[cur].t} にあるボタンと行き先</h3><ul>${outs.length ? outs.map(e => `<li><span class="btnname${e.back?' back':''}">${esc(e.l)}</span>→ ${nid(e.t)} ${N[e.t].t}${e.back?'<span class="chip">戻る</span>':''}</li>`).join('') : '<li class="hint">この画面から出る遷移は、サイドメニューなど共通の操作のみです</li>'}${dev==='admin'?'<li class="hint">左のサイドメニューから、どの画面にも移動できます</li>':''}</ul></div>
      <div class="sub"><h3>操作の履歴（新しい順）</h3><ul>${hist}</ul></div>
    </div>`;
}

/* ---------- 描画 ---------- */
const BW = 1064, BH = 808;
function deviceBlock(dev){
  const sc = S[dev].screen;
  return `<div class="devblock"><div class="devlabel">${DEVNAME[dev]}<span class="cur">${nid(sc)} ${MAPS[dev].nodes[sc].t}</span></div><div class="fitwrap"><div class="bezel"><div class="screen">${SCR[sc]()}</div></div></div>${demoStrip(dev)}</div>`;
}
function render(){
  const both = S.mode==='both', devs = both ? ['cust','staff'] : [S.mode];
  const app = $('#app');
  const y = window.scrollY;
  app.className = 'layout ' + (both ? 'both' : 'single');
  const sx = [...document.querySelectorAll('.fitwrap')].map(w => w.scrollLeft);
  app.innerHTML = `<section class="stage">${devs.map(deviceBlock).join('')}</section><aside class="mappanel">${mapPanel()}</aside>`;
  document.querySelectorAll('.top .tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.mode===S.mode));
  fit(); document.querySelectorAll('.fitwrap').forEach((w, i) => { w.scrollLeft = sx[i] || 0; }); window.scrollTo(0, y);
}
/* スマホ縦向きで文字が小さすぎるとき用。オンにすると最低0.55倍で表示し、端末の枠を横にスクロールして見る */
let ZOOM = false;
function fit(){ document.querySelectorAll('.fitwrap').forEach(w => {
  w.classList.toggle('zoom', ZOOM);
  const s = ZOOM ? Math.max(w.clientWidth / BW, 0.55) : w.clientWidth / BW;
  w.firstElementChild.style.transform = `scale(${s})`; w.style.height = (BH*s) + 'px';
}); }
window.addEventListener('resize', fit);

/* ---------- 操作 ---------- */
const ACT = {
  go: d => go(d.dev, d.to, d.l),
  jump: d => jump(d.dev, d.to),
  mode: d => { S.mode = d.mode; if(d.mode!=='both') S.mapDev = d.mode; else if(S.mapDev==='admin') S.mapDev = 'cust'; render(); },
  mapDev: d => { S.mapDev = d.dev; render(); },
  zoom: (d, el) => { ZOOM = !ZOOM; el.setAttribute('aria-pressed', ZOOM); el.textContent = `端末の画面を拡大：${ZOOM ? 'オン' : 'オフ'}`; fit(); },
  reset: () => { ['cust','staff','admin'].forEach(clearT); const mode = S.mode; S = initState(); S.mode = mode; S.mapDev = mode==='both' ? 'cust' : mode; render(); toast('最初の状態に戻しました'); },
  demoFace: d => { S.demo.face = d.v; render(); },
  demoCo: d => { startCheckout(+d.v); if(S.staff.screen==='S02') go('staff','S03','顔照合を開始'); render(); toast(`スタッフ端末で ${yen(d.v)} の会計が入力されました`); },
  autoBack: () => { S.demo.autoBack = !S.demo.autoBack; clearT('cust'); render(); if(S.demo.autoBack && S.cust.screen==='C04'){ S.cust.countdown = 10; render(); startC04Timer(); } },
  cDigit: d => { if(S.cust.digits.length < 4){ S.cust.digits += d.k; render(); } },
  cDel: () => { S.cust.digits = S.cust.digits.slice(0,-1); render(); },
  cClear: () => { S.cust.digits = ''; render(); },
  cPick: d => { identify(d.id, 'phone'); go('cust','C04','ニックネームを選択'); },
  age: d => { S.cust.draft.age = d.v; render(); },
  regNext: () => {
    const d = S.cust.draft, digits = d.phone.replace(/\D/g,'');
    if(!d.nickname.trim()) S.cust.err = 'ニックネームを入力してください';
    else if(digits.length < 10) S.cust.err = '電話番号を10桁か11桁で入力してください';
    else if(!d.age) S.cust.err = '年代を選んでください';
    else { S.cust.err = ''; go('cust','C07','次へ'); return; }
    render();
  },
  demoFill: () => { S.cust.draft = {nickname:'はじめてのたこ', phone:'080-5555-6666', age:'20代'}; S.cust.err = ''; render(); },
  policy: () => { S.cust.showPolicy = !S.cust.showPolicy; render(); },
  faceNo: () => { clearT('cust'); createMember(false); go('cust','C09','顔は使わない'); },
  spoof: () => { clearT('cust'); S.cust.liveFail = true; render(); },
  stampNew: () => { identify(S.cust.newId, 'new'); go('cust','C04','スタンプを押す'); },
  useReward: () => {
    if(!S.checkout) S.checkout = {amount:0, status:'done', memberId:S.cust.matched, granted:0, method:'face'};
    S.checkout.status = 'reward'; S.checkout.memberId = S.cust.matched;
    go('cust','C11','特典を使う');
  },
  qr: d => { identify(d.id, 'qr'); go('cust','C04','QRを読み取り（自動）'); },
  confirmReward: () => confirmReward(),
  rewardBack: () => { if(S.checkout) S.checkout.status = 'done'; go('staff','S03','申請を取り消す'); if(S.cust.screen==='C11') go('cust','C04','スタッフが申請を取り消し（自動）'); },
  pin: d => { S.staff.pin += d.k; if(S.staff.pin.length >= 4) go('staff','S02','PINを入力'); else render(); },
  pinDel: () => { S.staff.pin = S.staff.pin.slice(0,-1); render(); },
  amt: d => { let a = S.staff.amount; a = d.k==='C' ? '' : (a + d.k).replace(/^0+/,'').slice(0,6); S.staff.amount = a; render(); },
  amtAdd: d => { S.staff.amount = String((+S.staff.amount || 0) + (+d.v)); render(); },
  startQuick: () => { startCheckout(null); go('staff','S03','簡易モードで照合を開始'); },
  startCo: () => { const a = +S.staff.amount; if(!a) return; startCheckout(a); go('staff','S03','顔照合を開始'); },
  nonMember: () => { const a = +S.staff.amount; S.visits.unshift({time:nowT(), nick:'非会員', amount:a, method:'none', granted:0}); toast(`非会員の来店（${yen(a)}）を記録しました`); go('staff','S02','非会員として記録'); },
  nextCo: () => { S.checkout = null; go('staff','S02','次の会計へ'); },
  demoCustFace: () => { go('cust','C03','顔でスタンプ'); render(); },
  demoCustReward: () => { S.cust.matched = S.checkout.memberId; S.checkout.status = 'reward'; go('cust','C11','特典を使う'); },
  sSel: d => { S.staff.sel = d.id; render(); },
  sReason: d => { S.staff.reason = d.v; render(); },
  manualGrant: () => {
    const m = mem(S.staff.sel); if(!m) return;
    if(S.checkout && S.checkout.status==='waiting') identify(m.id, 'staff');
    else { m.stamps++; m.visits++; m.last = '今日'; S.visits.unshift({time:nowT(), nick:m.nick, amount:0, method:'staff', granted:1}); audit('スタッフ','スタンプ付与', `${m.nick}（スタッフ検索）`); }
    audit('スタッフ','手動付与の理由', `${m.nick}：${S.staff.reason}`);
    toast(`${m.nick}さんにスタンプを1個付与しました`);
    go('staff','S02','スタンプを付与／戻る');
  },
  cReason: d => { S.staff.cancelReason = d.v; render(); },
  doCancel: () => {
    const co = S.checkout, m = co && mem(co.memberId); if(!m) return;
    m.stamps = Math.max(0, m.stamps - 1); m.today = Math.max(0, m.today - 1);
    audit('スタッフ','スタンプ取消', `${m.nick}：${S.staff.cancelReason}`);
    S.checkout = null; toast(`${m.nick}さんのスタンプを1個取り消しました`);
    go('staff','S02','取り消す（確定）');
  },
  aSel: d => { S.admin.sel = d.id; go('admin','A04','会員の行をタップ'); },
  aConfirm: d => { S.admin.confirm = d.v || null; render(); },
  aDo: () => {
    const m = mem(S.admin.sel); if(!m) return;
    if(S.admin.confirm==='face'){ m.face = false; if(S.demo.face===m.id) S.demo.face = 'none'; audit('店主','顔データ削除', m.nick); S.admin.confirm = null; toast('顔データを削除しました。スタンプは残っています'); render(); }
    else { S.members = S.members.filter(x => x.id !== m.id); if(S.demo.face===m.id) S.demo.face = 'none'; audit('店主','退会処理', m.nick); toast(`${m.nick}さんを退会させました`); go('admin','A03','一覧へ戻る／退会させる'); }
  },
  saveSet: () => {
    const v = id => document.getElementById(id).value, n = (id, min) => Math.max(min, parseInt(v(id),10) || min);
    Object.assign(S.settings, {minAmount:n('set-min',0), dailyLimit:n('set-limit',1), required:Math.min(n('set-req',1),10), rewardName:v('set-reward').trim() || '特典', expireMonths:n('set-exp',1), threshold:Math.min(n('set-th',50),100)});
    audit('店主','設定変更', `${S.settings.minAmount}円以上で1個／1日${S.settings.dailyLimit}個まで／${S.settings.required}個で「${S.settings.rewardName}」`);
    toast('設定を保存しました'); go('admin','A05','保存する');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const f = ACT[el.dataset.a]; if(f) f(el.dataset, el);
});
document.addEventListener('keydown', e => {
  if((e.key==='Enter' || e.key===' ') && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='r-nick') S.cust.draft.nickname = t.value;
  if(t.id==='r-phone') S.cust.draft.phone = t.value;
  if(t.id==='s-search'){ S.staff.search = t.value; const l = document.getElementById('s-list'); if(l) l.innerHTML = staffList(); }
});
render();
</script>
</body>
</html>
